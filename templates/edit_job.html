{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h2 class="mb-0">
                        Edit Job
                    </h2>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Save Changes

                            </button>

                            <a
                                href="{% url 'job_list' %}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
